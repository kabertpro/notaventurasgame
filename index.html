<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notaventuras Game - KABERT STUDIO</title>
    <!-- Tipografías Premium para Videojuegos -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div id="app-viewport">
        
        <!-- PANTALLA SPLASH DE INICIO (KABERT STUDIO) -->
        <div id="splash-layer" class="splash-container">
            <h1 class="splash-title">NOTAVENTURAS GAME</h1>
            <p class="splash-subtitle">KABERT STUDIO – LMKE</p>
            <div class="loading-bar"><div class="progress"></div></div>
        </div>

        <!-- INTERFAZ DEL MENÚ PRINCIPAL -->
        <div id="menu-layer" class="screen-overlay hidden">
            <div class="menu-card">
                <h2>NOTAVENTURAS GAME</h2>
                <p style="color: #41E1FA; margin-bottom: 20px; font-size: 0.9rem;">SELECCIONA UN MODO DE JUEGO</p>
                <div class="menu-grid">
                    <button class="menu-btn" data-action="play-libre">Modo Libre (Práctica)</button>
                    <button class="menu-btn" data-action="play-botones">Botones Musicales (Grupo 1)</button>
                    <button class="menu-btn" data-action="play-piano">Teclado de Piano</button>
                    <button class="menu-btn" data-action="play-contrarreloj">Contrarreloj (60s)</button>
                    <button class="menu-btn" data-action="play-desafio">Desafío Extremo (Grupo 2)</button>
                    <button class="menu-btn accent" data-action="open-custom">Personalizar Notahead</button>
                </div>
            </div>
        </div>

        <!-- MODAL INTERACTIVO DE PERSONALIZACIÓN -->
        <div id="custom-layer" class="screen-overlay hidden">
            <div class="menu-card">
                <h2>PANEL DE PERSONALIZACIÓN</h2>
                <p style="color: #FFD700; margin-bottom: 15px;">Selecciona la cabeza de tus notas:</p>
                <div class="head-selector-grid" id="heads-grid"></div>
                <button class="menu-btn accent" id="close-custom-btn" style="margin-top: 20px; width: 100%;">Guardar y Regresar</button>
            </div>
        </div>

        <!-- PANEL SUPERIOR DE MÉTRICAS (HUD) -->
        <header id="game-hud">
            <div class="hud-item">MODO: <span id="hud-mode">-</span></div>
            <div class="hud-item">PUNTOS: <span id="hud-score">0</span></div>
            <div class="hud-item">RHA (COMBO): <span id="hud-combo">0</span> / Max: <span id="hud-streak">0</span></div>
            <div class="hud-item">PRECISIÓN: <span id="hud-accuracy">100</span>%</div>
            <button id="menu-back-btn" class="hud-back hidden">Menú</button>
        </header>

        <!-- MOTOR GRÁFICO (CANVAS) -->
        <main id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </main>

        <!-- MUELLE DE INTERACCIÓN DINÁMICA (PIANO / BOTONES) -->
        <footer id="interaction-dock">
            <div style="color: rgba(255,255,255,0.4); font-size: 1.1rem;">Selecciona un modo para empezar a interactuar</div>
        </footer>

    </div>

    <!-- Script Principal del Sistema -->
    <script type="module" src="js/game.js"></script>
</body>
</html>
